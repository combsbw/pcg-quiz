<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LFN Learn — Patient Care Guidelines</title>
<meta name="description" content="Spaced-repetition learning over the Life Flight Network Patient Care Guidelines. Works offline.">
<!-- Browser UI colour follows the app background in each theme, so the
     surrounding chrome does not clash with the page. -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1116">

<link rel="manifest" href="manifest.webmanifest">

<!-- iOS "Add to Home Screen" does NOT read the web manifest: it uses these
     apple-* tags. The icons are opaque and square-cornered on purpose — iOS
     has no alpha on home-screen icons (transparency composites to black) and
     applies its own rounded mask. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LFN Learn">
<!-- "default" keeps the web view below the status bar. black-translucent would
     slide the sticky top bar under the clock unless every inset is handled. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231e63d0'/><rect x='12.2' y='6.4' width='7.5' height='19.2' rx='1.7' fill='white'/><rect x='6.4' y='12.2' width='19.2' height='7.5' rx='1.7' fill='white'/></svg>">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/quiz.css">
<link rel="stylesheet" href="css/analytics.css">
<script>
  // Apply the stored theme before first paint so there is no flash.
  try {
    var s = JSON.parse(localStorage.getItem('lfn.progress.v1') || '{}');
    var t = (s.settings && s.settings.theme) || 'auto';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span>LFN&nbsp;Learn <small id="ver"></small></span>
    </div>
    <div class="spacer"></div>
    <nav class="nav" id="nav" aria-label="Main">
      <a href="#/" data-route="/">Home</a>
      <a href="#/study" data-route="/study">Study</a>
      <a href="#/modules" data-route="/modules">Modules</a>
      <a href="#/browse" data-route="/browse">Browse</a>
      <a href="#/stats" data-route="/stats">Analytics</a>
      <a href="#/review" data-route="/review">Review <span class="nav-badge" id="revBadge" hidden></span></a>
    </nav>
    <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle colour theme">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2
        M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
      </svg>
    </button>
    <a class="icon-btn" href="#/settings" title="Settings" aria-label="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 14a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.5-2.6 2 2 0 1 1 2.8-2.8A1.7 1.7 0 0 0 10 3a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.6 1.5 2 2 0 1 1 2.8 2.8A1.7 1.7 0 0 0 21 10a2 2 0 1 1 0 4 1.7 1.7 0 0 0-1.6 1z"/>
      </svg>
    </a>
  </header>

  <main class="main" id="view" tabindex="-1">
    <div class="empty"><h3>Loading guidelines…</h3></div>
  </main>
</div>

<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script type="module" src="js/main.js"></script>
<noscript><p style="padding:2rem">This app needs JavaScript.</p></noscript>
</body>
</html>
